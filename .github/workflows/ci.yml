name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests dels scripts
        working-directory: scripts
        run: npm ci && npm test

      - name: Tests de les regles del joc
        run: ./gradlew -p joc test --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Compila l'app
        run: ./gradlew :app:assembleDebug --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Tests unitaris de l'app
        run: ./gradlew :app:testDebugUnitTest --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew :app:lintDebug --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: APK de prova
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            joc/build/reports/

      # L'últim pas: un resum dels errors, perquè sigui el final del registre.
      - name: Resum d'errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*(error|Error)|What went wrong|FAILED|Error:|error:|tests completed|> .*Exception|lint found" build.log | grep -v "^\s*at " | head -200 || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A5 "<failure" "$f" | head -40; done 2>/dev/null || true
          find app/build/reports/lint-results* -name "*.txt" -exec head -150 {} \; 2>/dev/null || true

  # Tests de UI amb l'app real en un emulador.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Activa KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests de UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --continue > ui.log 2>&1

      - name: Resum d'errors
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|Exception|AssertionError|tests completed" ui.log | head -100 || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -A8 "<failure" {} \; 2>/dev/null | head -80 || true
