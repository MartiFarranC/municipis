name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests dels scripts
        working-directory: scripts
        run: npm ci && npm test

      - name: Tests de les regles del joc
        run: ./gradlew -p joc test --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Compila l'app
        run: ./gradlew :app:assembleDebug :app:assembleRelease --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Tests unitaris de l'app
        run: ./gradlew :app:testDebugUnitTest --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew :app:lintDebug --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: APK de prova
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            joc/build/reports/

      # L'últim pas: un resum dels errors, perquè sigui el final del registre.
      - name: Resum d'errors
        if: failure()
        run: |
          grep -E "^e: |^w: .*(error|Error)|What went wrong|FAILED|Error:|error:|tests completed|> .*Exception|lint found" build.log | grep -v "^\s*at " | head -200 || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A5 "<failure" "$f" | head -40; done 2>/dev/null || true
          find app/build/reports/lint-results* -name "*.txt" -exec head -150 {} \; 2>/dev/null || true

  # Esquema de Supabase (RLS i funcions) en un Supabase local, mai contra el projecte compartit.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Engega Supabase
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Tests de la base de dades
        run: supabase test db

      - name: Lint de la base de dades
        run: supabase db lint --schema descobreix --level warning --fail-on warning

  # Tests de UI amb l'app real en un emulador.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Activa KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests de UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --continue > ui.log 2>&1

      - name: Resum d'errors
        if: failure()
        run: |
          grep -E "^e: |FAILED|What went wrong|Exception|AssertionError|tests completed" ui.log | head -100 || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec grep -A150 "<failure" {} \; 2>/dev/null | head -250 || true

  # Publica l'app a les releases de GitHub, d'on la baixa Obtainium (docs/obtainium.md).
  # Només a main i només si tot el que hi ha a sobre ha passat.
  publica:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, supabase, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprova els secrets
        id: secrets
        env:
          SIGNATURA_CLAU: ${{ secrets.SIGNATURA_CLAU }}
        run: |
          if [ -z "$SIGNATURA_CLAU" ]; then
            echo "::warning::No es publica: falta el secret SIGNATURA_CLAU (docs/obtainium.md)."
            echo "hi_son=no" >> "$GITHUB_OUTPUT"
          else
            echo "hi_son=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.hi_son == 'si'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.hi_son == 'si'

      - name: Compila l'APK signat
        if: steps.secrets.outputs.hi_son == 'si'
        env:
          SIGNATURA_CLAU: ${{ secrets.SIGNATURA_CLAU }}
          SIGNATURA_CONTRASENYA: ${{ secrets.SIGNATURA_CONTRASENYA }}
          SIGNATURA_ALIES: ${{ secrets.SIGNATURA_ALIES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSIO_CODI: ${{ github.run_number }}
        run: |
          export SIGNATURA_FITXER="$RUNNER_TEMP/clau.jks"
          echo "$SIGNATURA_CLAU" | base64 -d > "$SIGNATURA_FITXER"
          ./gradlew :app:assembleRelease
          rm -f "$SIGNATURA_FITXER"

      - name: Publica la release
        if: steps.secrets.outputs.hi_son == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versio="1.0.${{ github.run_number }}"
          apk="descobreix-catalunya-$versio.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "v$versio" "$apk" \
            --title "Descobreix Catalunya $versio" \
            --notes "$(git log -1 --format=%s)" \
            --target "${{ github.sha }}"
